name: Google Maps taraması

# Supabase'deki dakikalık "tick" fonksiyonu her sabah 08.00'de ve "Şimdi tara" isteğinde bu işi tetikler
# (GitHub'ın kendi zamanlayıcısı güvenilir çalışmadığı için kullanılmıyor). Elle de çalıştırılabilir.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Çalıştırılacak görev
        required: true
        default: daily
        type: choice
        options: [daily]

permissions:
  contents: read

concurrency:
  group: crm-scan
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.JOBS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tarama ve günün listesi
        run: npx tsx jobs/run.ts daily
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAPS_SCRAPER_IMAGE: gosom/google-maps-scraper:v1.18.1
          GMAPS_SCRAPER_WORKDIR: ${{ runner.temp }}/scraper
