name: Google Maps taraması

# Supabase'deki dakikalık "tick" fonksiyonu her sabah 08.00'de ve "Şimdi tara" isteğinde bu işi tetikler
# (GitHub'ın kendi zamanlayıcısı güvenilir çalışmadığı için kullanılmıyor). Elle de çalıştırılabilir.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Çalıştırılacak görev
        required: true
        default: daily
        type: choice
        options: [daily, full]

permissions:
  contents: read

jobs:
  run:
    if: ${{ vars.JOBS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Tam Ankara taraması (full) tek seferlik: sorgular 6 parçaya bölünür, her parça ayrı makinede paralel.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.task == 'full' && '[0,1,2,3,4,5]' || '[0]') }}
    concurrency:
      group: crm-scan-${{ inputs.task }}-${{ matrix.shard }}
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.task == 'full' && 340 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tarama ve günün listesi
        run: npx tsx jobs/run.ts "$TASK"
        env:
          TASK: ${{ inputs.task }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.task == 'full' && 6 || 1 }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAPS_SCRAPER_IMAGE: gosom/google-maps-scraper:v1.18.1
          GMAPS_SCRAPER_WORKDIR: ${{ runner.temp }}/scraper
